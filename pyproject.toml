[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-ramp"
version = "0.1.0"
description = "Local-first Python repository understanding CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Peng Ding" }]
dependencies = ["typer>=0.27,<1.0"]
keywords = [
  "python",
  "cli",
  "developer-tools",
  "repository-analysis",
  "open-source",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Nightdp/reposense-py"
Source = "https://github.com/Nightdp/reposense-py"
Issues = "https://github.com/Nightdp/reposense-py/issues"
Changelog = "https://github.com/Nightdp/reposense-py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
reporamp = "repo_ramp.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "tests/fixtures"]
